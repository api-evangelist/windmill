      summary: Get the Full Schema of a Datatable Database as TableEditorValues
      operationId: getDatatableFullSchema
      tags:
      - workspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              properties:
                source:
                  type: string
                  description: Source datatable, e.g. 'datatable://main'
      responses:
        '200':
          description: 'Schema as { schema_name: { table_name: TableEditorValues } }'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: object
                    required:
                    - name
                    - columns
                    - foreign_keys
                    properties:
                      name:
                        type: string
                      columns:
                        type: array
                        items:
                          type: object
                          required:
                          - name
                          - datatype
                          properties:
                            name:
                              type: string
                            datatype:
                              type: string
                            primary_key:
                              type: boolean
                            default_value:
                              type: string
                            nullable:
                              type: boolean
                      foreign_keys:
                        type: array
                        items:
                          type: object
                          required:
                          - columns
                          - on_delete
                          - on_update
                          properties:
                            target_table:
                              type: string
                            columns:
                              type: array
                              items:
                                type: object
                                properties:
                                  source_column:
                                    type: string
                                  target_column:
                                    type: string
                            on_delete:
                              type: string
                            on_update:
                              type: string
                            fk_constraint_name:
                              type: string
                      pk_constraint_name:
                        type: string
