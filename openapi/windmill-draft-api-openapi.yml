openapi: 3.2.0
info:
  version: 1.694.0
  title: Windmill Draft API
  contact:
    name: Windmill Team
    email: contact@windmill.dev
    url: https://windmill.dev
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://windmill.dev/img/windmill.svg
servers:
- url: /api
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: Draft
paths:
  /w/{workspace}/drafts/create:
    post:
      summary: Create Draft
      operationId: createDraft
      tags:
      - Draft
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                typ:
                  type: string
                  enum:
                  - flow
                  - script
                  - app
                value: {}
              required:
              - path
              - typ
              - enum
      responses:
        '201':
          description: draft created
          content:
            text/plain:
              schema:
                type: string
  /w/{workspace}/drafts/delete/{kind}/{path}:
    delete:
      summary: Delete Draft
      operationId: deleteDraft
      tags:
      - Draft
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - script
          - flow
          - app
      - $ref: '#/components/parameters/ScriptPath'
      responses:
        '200':
          description: draft deleted
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    WorkspaceId:
      name: workspace
      in: path
      required: true
      schema:
        type: string
    ScriptPath:
      name: path
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
externalDocs:
  description: documentation portal
  url: https://windmill.dev
