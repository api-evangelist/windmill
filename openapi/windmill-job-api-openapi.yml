                  approval_conditions:
                    type: object
                    properties:
                      user_auth_required:
                        type: boolean
                      user_groups_required:
                        type: array
                        items:
                          type: string
                      self_approval_disabled:
                        type: boolean
                    required:
                    - user_auth_required
                    - user_groups_required
                    - self_approval_disabled
                  can_approve:
                    type: boolean
                    description: whether the current user/token holder can approve
                  user_auth_required:
                    type: boolean
                    description: whether user authentication is required to approve
                  hide_cancel:
                    type: boolean
                    description: whether to hide the cancel button in the UI
                  approvers:
                    type: array
                    items:
                      type: object
                      required:
                      - resume_id
                      - approver
                      properties:
                        resume_id:
                          type: integer
                        approver:
