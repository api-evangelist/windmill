openapi: 3.0.3
info:
  version: 1.694.0
  title: Windmill admin job API
  contact:
    name: Windmill Team
    email: contact@windmill.dev
    url: https://windmill.dev
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://windmill.dev/img/windmill.svg
servers:
- url: /api
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: job
paths:
  /w/{workspace}/jobs/list_selected_job_groups:
    post:
      summary: List Selected Jobs Script/flow Schemas Grouped by (kind, Path)
      operationId: listSelectedJobGroups
      tags:
      - job
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        description: script args
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: result
          content:
            text/plain:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - script
                      - flow
                    script_path:
                      type: string
                    latest_schema:
                      type: object
                    schemas:
                      type: array
                      items:
                        type: object
                        properties:
                          schema:
                            type: object
                          script_hash:
                            type: string
                          job_ids:
                            type: array
                            items:
                              type: string
                        required:
                        - schema
                        - script_hash
                        - job_ids
                  required:
                  - kind
                  - script_path
                  - latest_schema
                  - schemas
  /w/{workspace}/jobs/run/p/{path}:
    post:
      summary: Run Script by Path
      operationId: runScriptByPath
      x-mcp-tool: true
      x-mcp-instructions: You should first use getScriptByPath to retrieve the script's schema and understand what arguments are expected.
      x-mcp-tool-include-query-params: []
      tags:
      - job
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ScriptPath'
      - name: scheduled_for
        description: when to schedule this job (leave empty for immediate run)
        in: query
        schema:
          type: string
          format: date-time
      - name: scheduled_in_secs
        description: schedule the script to execute in the number of seconds starting now
        in: query
        schema:
          type: integer
      - name: skip_preprocessor
        description: skip the preprocessor
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/ParentJob'
      - $ref: '#/components/parameters/WorkerTag'
      - $ref: '#/components/parameters/CacheTtl'
      - $ref: '#/components/parameters/NewJobId'
      - name: invisible_to_owner
        description: make the run invisible to the the script owner (default false)
        in: query
        schema:
          type: boolean
      requestBody:
        description: script args
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptArgs'
      responses:
        '201':
          description: job created
          content:
            text/plain:
              schema:
                type: string
                format: uuid
  /w/{workspace}/jobs/run_wait_result/p/{path}:
    post:
      summary: Run Script by Path
      operationId: runWaitResultScriptByPath
      tags:
